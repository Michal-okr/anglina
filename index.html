<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Angličtina pro prvňáčky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: domovská obrazovka s obrázkovými tématy -> uvnitř tématu jedna velká "pohádková karta"; mluvení ukazuje bublina s mikrofonem dole */
:root{
  --bg:#E6F2EA; --paper:#FFFFFF; --ink:#1E2A47; --muted:#5D6B7E; --line:#C7DCCF;
  --accent:#F25F3F; --on-accent:#FFFFFF; --sun:#FFC94A; --good:#2E9E68; --sky:#CDE7F6; --grass:#9FD8A8; --talk:#4A8FE0;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13202B; --paper:#1E2E3C; --ink:#F2F5F0; --muted:#A8B7C5; --line:#2D4558;
    --accent:#FF7A5C; --on-accent:#1A1410; --sun:#FFD166; --good:#4CC38A; --sky:#2A4A63; --grass:#2F6B4A; --talk:#6AA8F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13202B; --paper:#1E2E3C; --ink:#F2F5F0; --muted:#A8B7C5; --line:#2D4558;
  --accent:#FF7A5C; --on-accent:#1A1410; --sun:#FFD166; --good:#4CC38A; --sky:#2A4A63; --grass:#2F6B4A; --talk:#6AA8F0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 140px;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px}
.home{width:56px;height:56px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.home svg{width:30px;height:30px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;letter-spacing:-.5px}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.note{background:var(--sun);color:#1E2A47;border-radius:14px;padding:10px 14px;font-weight:700;margin:0}

/* domů: témata */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.topic{border:0;background:var(--paper);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;transition:transform .15s}
.topic:hover{transform:translateY(-3px)}
.topic .pic{border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky) 0 80%,var(--grass) 80% 100%);aspect-ratio:760/290;display:flex;align-items:flex-end}
.topic .pic svg{width:100%;height:auto;display:block}
.topic b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--accent)}
.topic small{color:var(--muted);font-weight:700}

.tabs{display:flex;gap:6px;background:var(--paper);padding:6px;border-radius:28px;box-shadow:0 5px 0 var(--line);align-self:center;max-width:100%}
.tab{font-family:var(--display);font-weight:700;border:0;background:transparent;padding:8px clamp(14px,4vw,26px);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:52px;height:52px}
.tab small{font-size:12px;opacity:.75}
.tab[aria-selected="true"]{background:var(--sun);color:#1E2A47}

.card{background:var(--paper);border-radius:30px;box-shadow:0 8px 0 var(--line);padding:clamp(16px,4vw,28px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

/* scéna s postavou */
.stage{position:relative;width:min(100%,330px);aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:linear-gradient(var(--sky) 0 80%,var(--grass) 80% 100%);cursor:pointer;max-width:100%}
.stage.wide{width:100%;aspect-ratio:760/290}
.stage::before{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--sun);top:7%;right:7%;box-shadow:0 0 0 10px color-mix(in srgb,var(--sun) 30%,transparent)}
.stage.wide::before{width:9%}
.tap{position:absolute;right:12%;bottom:14%;width:22%;z-index:2;pointer-events:none;animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-10px) scale(.92)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pop{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.pop svg{width:88%;height:auto;display:block;animation:bob 3.2s ease-in-out .8s infinite}
.stage.wide .pop svg{width:100%}
@keyframes pop{0%{transform:translateY(40%) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

svg .arm-r{transform-origin:151px 146px}
.waving .arm-r{animation:wave 1.5s ease-in-out}
@keyframes wave{0%{transform:rotate(0)}20%{transform:rotate(-145deg)}35%{transform:rotate(-118deg)}50%{transform:rotate(-148deg)}65%{transform:rotate(-118deg)}80%{transform:rotate(-142deg)}100%{transform:rotate(0)}}
svg .eyes{transform-origin:100px 86px;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.wordrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.word{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,60px);line-height:1;color:var(--accent)}
.wordcz{font-weight:800;color:var(--muted);font-size:20px}
.speak{width:54px;height:54px;border-radius:50%;border:0;background:var(--sun);color:#1E2A47;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000);flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.speak svg{width:28px;height:28px}
.speak.small{width:44px;height:44px}
.speak.small svg{width:22px;height:22px}

.sentence-row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;min-height:72px}
.sentence{font-family:var(--display);font-weight:800;font-size:clamp(30px,7.5vw,50px);line-height:1.1;margin:0;display:flex;flex-wrap:wrap;gap:.25em;justify-content:center;min-width:0}
.sentence span{display:inline-block;animation:wordIn .5s cubic-bezier(.3,1.5,.5,1) both;transition:color .15s,transform .15s}
.sentence .key{color:var(--accent)}
.sentence span.lit{transform:translateY(-6px) scale(1.08);color:var(--good)}
@keyframes wordIn{0%{opacity:0;transform:translateY(24px) rotate(-6deg)}100%{opacity:1;transform:none}}
.cz{margin:0;color:var(--muted);font-weight:700;font-size:19px}
body.no-cz .cz,body.no-cz .wordcz{visibility:hidden}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.arrow{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);flex:none}
.arrow:disabled{opacity:.3;cursor:default}
.arrow:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.arrow svg{width:30px;height:30px}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-width:0}
.dot{width:18px;height:18px;border-radius:50%;border:0;background:var(--line);padding:0;display:grid;place-items:center}
.dot[aria-current="true"]{outline:3px solid var(--accent);outline-offset:2px}
.dot.done{background:var(--good)}

/* kvíz */
.question{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.question h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.5vw,44px);margin:0;line-height:1.1}
.question h2 b{color:var(--accent)}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.options.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.options.four{grid-template-columns:repeat(2,1fr)}}
.opt{border:4px solid var(--line);background:linear-gradient(var(--sky) 0 82%,var(--grass) 82% 100%);border-radius:22px;padding:8px 6px 0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.opt svg{width:100%;height:auto;display:block}
.opt.right{border-color:var(--good);animation:yay .6s ease}
.opt.wrong{border-color:var(--accent);animation:shake .45s ease}
@keyframes yay{40%{transform:scale(1.08) rotate(-2deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.stars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stars svg{width:30px;height:30px}
.stars .s0{fill:var(--line)}
.stars .s1{fill:var(--sun);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.stars .s2{fill:color-mix(in srgb,var(--sun) 45%,var(--line))}

/* pexeso */
.memtop{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;flex-wrap:wrap}
.counter{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--good);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:10px 20px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.icon{width:56px;height:56px;padding:0;display:grid;place-items:center;border-radius:50%}
.btn.icon svg{width:30px;height:30px}
.btn.big{width:76px;height:76px}.btn.big svg{width:40px;height:40px}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.mcard{border:0;padding:0;background:none;perspective:700px;aspect-ratio:3/4;min-width:0}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
.back{background:var(--accent);background-image:radial-gradient(circle at 25% 25%,rgba(255,255,255,.25) 0 10%,transparent 11%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.25) 0 10%,transparent 11%);justify-content:center;color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px)}
.front{transform:rotateY(180deg);background:linear-gradient(var(--sky) 0 78%,var(--grass) 78% 100%);border:3px solid var(--line)}
.front svg{width:92%;height:auto;display:block}
.front .lbl{position:absolute;top:6px;left:0;right:0;font-family:var(--display);font-weight:800;font-size:clamp(12px,3vw,18px);color:var(--ink)}
.mcard.done .front{border-color:var(--good)}

/* bublina mluvení: reproduktor = poslouchej, mikrofon = teď mluv ty */
.mic{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.mic .bub{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 0 rgba(0,0,0,.18);transition:background .2s}
.mic .bub svg{width:54px;height:54px;position:relative;z-index:1}
.mic .bub::before,.mic .bub::after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--accent);opacity:0}
.mic[data-state="listening"] .bub::before{animation:ring 1.4s ease-out infinite}
.mic[data-state="listening"] .bub::after{animation:ring 1.4s ease-out .7s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.mic[data-state="tap"] .bub{pointer-events:auto;cursor:pointer;width:120px;height:120px;animation:pulse 1.2s ease-in-out infinite}
.mic[data-state="tap"] .bub::before{animation:ring 1.8s ease-out infinite}
.mic .taphand{position:absolute;width:56px;right:-34px;bottom:-14px;pointer-events:none;animation:tap 1.2s ease-in-out infinite;display:none}
.mic[data-state="tap"] .taphand{display:block}
.mic[data-state="speaking"] .bub{background:var(--talk);color:#fff}
.mic[data-state="ok"] .bub{background:var(--good);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.mic[data-state="miss"] .bub{background:var(--sun);color:#1E2A47;animation:shake .45s ease}
.mic .tries{display:flex;gap:6px}
.mic .tries i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.mic .tries i.used{background:var(--sun);border-color:var(--sun)}
.mic small{background:var(--paper);padding:3px 12px;border-radius:999px;font-weight:700;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.mic small:empty{display:none}

/* oslava */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;padding:16px;z-index:10;backdrop-filter:blur(3px)}
.overlay .card{max-width:420px;width:100%;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.overlay h2{font-family:var(--display);font-weight:800;font-size:46px;margin:0;color:var(--accent);line-height:1}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow">
      <button class="home" id="homeBtn" aria-label="Domů" hidden><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="brand">
        <h1 id="title">Let's <span>learn!</span></h1>
        <p id="subtitle">Angličtina pro prvňáčky</p>
      </div>
    </div>
    <div class="toggles">
      <button class="chip" id="micBtn" aria-pressed="false" title="Dítě opakuje slovíčka do mikrofonu">🎤 Mluvení</button>
      <button class="chip" id="slowBtn" aria-pressed="false" title="Pomalejší čtení">🐢 Pomaleji</button>
      <button class="chip" id="czBtn" aria-pressed="true" title="Zobrazit český překlad">Překlad</button>
    </div>
  </header>

  <p class="note" id="note" hidden></p>

  <!-- DOMŮ -->
  <section id="home" class="view">
    <div class="topics" id="topics"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" data-view="learn" aria-selected="true" aria-label="Učíme se"><svg viewBox="0 0 48 48"><circle cx="24" cy="17" r="9" fill="#F7CBA8"/><path d="M8 44c0-10 7-16 16-16s16 6 16 16z" fill="#FF7A9C"/><path d="M15 15q0-10 9-10t9 10q-4-4-9-4t-9 4z" fill="#7A4A2A"/></svg><small>Učíme se</small></button>
    <button class="tab" role="tab" data-view="quiz" aria-selected="false" aria-label="Kde je?"><svg viewBox="0 0 48 48"><path d="M6 18v12h8l10 8V10L14 18z" fill="currentColor"/><path d="M31 17a9 9 0 0 1 0 14M36 12a16 16 0 0 1 0 24" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><small>Kde je?</small></button>
    <button class="tab" role="tab" data-view="memory" aria-selected="false" aria-label="Pexeso"><svg viewBox="0 0 48 48"><rect x="4" y="10" width="20" height="28" rx="4" fill="#F25F3F" transform="rotate(-8 14 24)"/><rect x="24" y="10" width="20" height="28" rx="4" fill="#4A8FE0" transform="rotate(8 34 24)"/><text x="14" y="30" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif" transform="rotate(-8 14 24)">?</text><text x="34" y="30" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif" transform="rotate(8 34 24)">?</text></svg><small>Pexeso</small></button>
  </nav>

  <!-- UČÍME SE -->
  <section id="learn" class="view" hidden>
    <div class="card">
      <div class="stage" id="stage"></div>
      <div class="wordrow">
        <span class="word" id="word"></span>
        <button class="speak small" id="sayWord" aria-label="Přečíst slovo"></button>
        <span class="wordcz" id="wordCz"></span>
      </div>
      <div class="sentence-row">
        <p class="sentence" id="sentence"></p>
        <button class="speak" id="saySentence" aria-label="Přečíst větu"></button>
      </div>
      <p class="cz" id="cz"></p>
    </div>
    <div class="nav" style="margin-top:18px">
      <button class="arrow" id="prev" aria-label="Předchozí"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="dots" id="dots"></div>
      <button class="arrow" id="next" aria-label="Další"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <!-- KVÍZ -->
  <section id="quiz" class="view" hidden>
    <div class="card">
      <div class="question">
        <h2 id="qText"></h2>
        <button class="speak pulse" id="qSay" aria-label="Zopakovat otázku"></button>
      </div>
      <p class="cz" id="qCz"></p>
      <div class="options" id="options"></div>
      <div class="stars" id="stars"></div>
    </div>
  </section>

  <!-- PEXESO -->
  <section id="memory" class="view" hidden>
    <div class="card">
      <div class="memtop">
        <span class="counter" id="moves">Tahy: 0</span>
        <button class="btn alt icon" id="memReset" aria-label="Zamíchat znovu"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18 2v5h-5M6 22v-5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</div>

<div class="mic" id="mic" hidden>
  <div class="bub" id="micBub" role="button" aria-label="Klepni a mluv"></div>
  <div class="tries" id="tries"><i></i><i></i><i></i></div>
  <small id="heard"></small>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <svg viewBox="0 0 24 24" style="width:110px;height:110px" class="pulse"><path fill="#FFC94A" d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>
    <h2>Well done!</h2>
    <div class="stars" id="ovStars"></div>
    <p id="ovText" class="cz"></p>
    <div class="row">
      <button class="btn icon big" id="ovAgain" aria-label="Hrát znovu"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M4 3v5h5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>
/* =====================================================================
   OBRÁZKY – postavy rodiny (SVG 200×260)
   ===================================================================== */
const SKIN = '#F7CBA8', SKIN2 = '#E8AC86', LINE = 'rgba(30,42,71,.25)', INK = '#1E2A47';

function bow(x, y, c){
  return `<g transform="translate(${x} ${y})"><path d="M0 0 L-12 -8 L-12 8Z M0 0 L12 -8 L12 8Z" fill="${c}"/><circle r="4" fill="${c}"/></g>`;
}
function person(l){
  const s = l.scale || 1, hc = l.hairColor, sh = l.shirt;
  let back = '', front = '', curl = '';
  switch (l.hair){
    case 'long':
      back = `<path d="M48 90 Q44 28 100 28 Q156 28 152 90 L158 165 Q100 180 42 165 Z" fill="${hc}"/>`;
      front = `<path d="M56 84 Q56 38 100 38 Q144 38 144 84 Q132 62 108 58 Q94 68 72 66 Q60 72 56 84Z" fill="${hc}"/>`; break;
    case 'short':

      front = `<path d="M56 84 Q56 38 100 38 Q144 38 144 84 Q130 64 100 62 Q70 64 56 84Z" fill="${hc}"/>` + bow(54, 80, l.bow) + bow(146, 80, l.bow); break;
    case 'spiky':
      front = `<path d="M56 82 L52 50 L69 57 L70 32 L87 45 L100 22 L113 45 L130 32 L131 57 L148 50 L144 82 Q124 60 100 62 Q76 60 56 82Z" fill="${hc}"/>`; break;
    case 'bun':

      front = `<path d="M56 84 Q54 40 100 40 Q146 40 144 84 Q134 62 100 60 Q66 62 56 84Z" fill="${hc}"/>`; break;
    case 'bald':
      front = `<path d="M57 94 Q52 66 64 58 Q66 76 71 88Z M143 94 Q148 66 136 58 Q134 76 129 88Z" fill="${hc}"/>`; break;
    case 'curl':
      curl = `<path d="M100 41 C96 26 116 22 115 33 C114 39 106 38 107 33" fill="none" stroke="${hc}" stroke-width="5" stroke-linecap="round"/>`; break;
  }
  const torso = l.top === 'dress'
    ? 'M40 262 L58 170 Q60 138 86 130 L114 130 Q140 138 142 170 L160 262 Z'

  let deco = '';

    if (l.tie) deco += `<path d="M100 147 L93 157 L100 205 L107 157Z" fill="${l.tie}"/>`;

  }
  if (l.top === 'dress'){
    deco = `<path d="M86 131 Q100 152 114 131Z" fill="${SKIN}"/>
      <g fill="#fff" opacity=".45"><circle cx="80" cy="182" r="5"/><circle cx="114" cy="170" r="5"/><circle cx="98" cy="212" r="5"/><circle cx="128" cy="224" r="5"/><circle cx="70" cy="236" r="5"/><circle cx="112" cy="246" r="5"/></g>`;
  }
  if (l.top === 'onesie'){
    deco = `<g fill="#fff"><circle cx="100" cy="168" r="5"/><circle cx="100" cy="194" r="5"/><circle cx="100" cy="220" r="5"/></g>`;
  }
  const armL = `<g class="arm-l"><rect x="38" y="140" width="22" height="72" rx="11" fill="${sh}" transform="rotate(12 49 146)"/><circle cx="36" cy="210" r="11" fill="${SKIN}"/></g>`;
  const armR = `<g class="arm-r"><rect x="140" y="140" width="22" height="72" rx="11" fill="${sh}" transform="rotate(-12 151 146)"/><circle cx="164" cy="210" r="11" fill="${SKIN}"/></g>`;
  const mouthCol = l.lips ? '#D9435E' : INK;
  let mouth = l.mustache
    ? `<path d="M91 113 Q100 121 109 113" stroke="${mouthCol}" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<path d="M88 108 Q100 120 112 108" stroke="${mouthCol}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  if (l.pacifier) mouth = `<circle cx="100" cy="111" r="10" fill="#FFC94A" stroke="${LINE}" stroke-width="3"/><circle cx="100" cy="111" r="4" fill="#FF8FA3"/>`;

  return `<g transform="translate(100 260) scale(${s}) translate(-100 -260)">
    <g stroke="${LINE}" stroke-width="3" stroke-linejoin="round">
      ${back}
      <circle cx="56" cy="88" r="9" fill="${SKIN}"/><circle cx="144" cy="88" r="9" fill="${SKIN}"/>
      <rect x="90" y="118" width="20" height="18" fill="${SKIN2}" stroke="none"/>
      <path d="${torso}" fill="${sh}"/>
    </g>
    ${deco}
    <g stroke="${LINE}" stroke-width="3">${armL}${armR}
      <circle cx="100" cy="84" r="44" fill="${SKIN}"/>
    </g>
    <circle cx="71" cy="102" r="8" fill="#FF8FA3" opacity=".5"/><circle cx="129" cy="102" r="8" fill="#FF8FA3" opacity=".5"/>
    <ellipse cx="100" cy="97" rx="4.5" ry="3.5" fill="${SKIN2}"/>
    ${mouth}
    <g class="eyes"><circle cx="84" cy="86" r="6" fill="${INK}"/><circle cx="116" cy="86" r="6" fill="${INK}"/><circle cx="86" cy="84" r="2" fill="#fff"/><circle cx="118" cy="84" r="2" fill="#fff"/></g>
    <g stroke="${LINE}" stroke-width="3" stroke-linejoin="round">${front}</g>
    ${curl}
    ${l.glasses ? `<g fill="none" stroke="#3A3F55" stroke-width="3"><circle cx="84" cy="86" r="12"/><circle cx="116" cy="86" r="12"/><path d="M96 86 h8"/></g>` : ''}
    ${l.mustache ? `<path d="M83 108 Q92 100 100 105 Q108 100 117 108 Q108 113 100 109 Q92 113 83 108Z" fill="${l.hairColor}" stroke="${LINE}" stroke-width="2"/>` : ''}
  </g>`;
}
const personSVG = (look, label) => `<svg viewBox="0 0 200 260" role="img" aria-label="${label}">${person(look)}</svg>`;

/* =====================================================================
   UČIVO – každé téma je jen data. Nové téma = přidat objekt do TOPICS.
   Položka: en (slovo), cz, sentence, czs, where (otázka v kvízu), czw, draw()
   final: závěrečná karta tématu (širší obrázek)
   ===================================================================== */
const LOOKS = {
  mother:     {hair:'long', hairColor:'#7A4A2A', top:'dress', shirt:'#FF7A9C', lips:true, scale:1},
  father:     {hair:'short', hairColor:'#3B2A20', top:'shirt', shirt:'#4A8FE0', tie:'#E64B3C', scale:1.04},
  sister:     {hair:'pigtails', hairColor:'#E3A63B', top:'dress', shirt:'#FFC94A', bow:'#FF5A7A', scale:.78},
  brother:    {hair:'spiky', hairColor:'#5A3A22', top:'shirt', shirt:'#3BB27A', scale:.8},
  grandmother:{hair:'bun', hairColor:'#C9CCD3', top:'dress', shirt:'#9B6FD1', glasses:true, lips:true, scale:.95},
  grandfather:{hair:'bald', hairColor:'#D5D8DE', top:'shirt', shirt:'#B5793F', bowtie:'#2F6FB8', glasses:true, mustache:true, scale:.97},
  baby:       {hair:'curl', hairColor:'#7A4A2A', top:'onesie', shirt:'#8ED1F0', pacifier:true, scale:.56},
};
function familyPicture(){
  const order = ['grandfather','grandmother','father','mother','baby','sister','brother'];
  return `<svg viewBox="0 0 760 290" role="img" aria-label="family">` + order.map((id, i) =>
    `<svg x="${i * 100}" y="60" width="160" height="230" viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet">${person(LOOKS[id])}</svg>`
  ).join('') + `</svg>`;
}
const fam = (en, cz, my, czMy) => ({
  id: en, en, cz,
  sentence: `This is ${my} ${en}.`, czs: `Tohle je ${czMy} ${cz}.`,
  where: `Where is ${my} ${en}?`, czw: `Kde je ${czMy} ${cz}?`,
  draw: () => personSVG(LOOKS[en], en),
});

const TOPICS = [
  {
    id: 'family', en: 'My family', cz: 'Rodina',
    cover: familyPicture,
    items: [
      fam('mother', 'maminka', 'my', 'moje'),
      fam('father', 'tatínek', 'my', 'můj'),
      fam('sister', 'sestra', 'my', 'moje'),
      fam('brother', 'bratr', 'my', 'můj'),
      fam('grandmother', 'babička', 'my', 'moje'),
      fam('grandfather', 'dědeček', 'my', 'můj'),
      {...fam('baby', 'miminko', 'the', ''), czs: 'Tohle je miminko.', czw: 'Kde je miminko?'},
    ],
    final: {id: 'family', en: 'family', cz: 'rodina', sentence: 'This is my family.', czs: 'Tohle je moje rodina.', draw: familyPicture, wide: true},
  },
];

/* =====================================================================
   POMOCNÍCI
   ===================================================================== */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const ICON_SPEAK = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a4.5 4.5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR = 'M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z';
document.querySelectorAll('.speak').forEach(b => b.innerHTML = ICON_SPEAK);

const store = {
  get(k, d){ try { const v = localStorage.getItem('anglina.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('anglina.' + k, JSON.stringify(v)); } catch (e) {} },
};
function note(text){ $('#note').textContent = text || ''; $('#note').hidden = !text; }

/* =====================================================================
   HLAS – čtení nahlas
   ===================================================================== */
const canSpeak = 'speechSynthesis' in window;
let voice = null, csVoice = null, slow = store.get('slow', false);
function pickVoices(){
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]GB/i.test(v.lang) && /Sonia|Libby|Hazel|Serena|Kate|Female|Google UK/i.test(v.name))
       || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  csVoice = vs.find(v => /^cs/i.test(v.lang)) || null;
}
if (canSpeak){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
else note('Tento prohlížeč neumí číst nahlas. Zkuste Chrome nebo Edge.');

let hlTimers = [];
function clearHighlight(){ hlTimers.forEach(clearTimeout); hlTimers = []; document.querySelectorAll('.sentence .lit').forEach(s => s.classList.remove('lit')); }
function say(text, opts = {}){
  return new Promise(resolve => {
    clearHighlight();
    if (!canSpeak) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = opts.cz ? csVoice : voice;
    u.lang = v ? v.lang : (opts.cz ? 'cs-CZ' : 'en-GB');
    if (v) u.voice = v;
    u.rate = opts.cz ? 1 : (slow ? .6 : .85);
    u.pitch = opts.cz ? 1 : 1.1;
    let fin = false;
    const done = () => { if (fin) return; fin = true; clearTimeout(to); if (opts.spans) setTimeout(clearHighlight, 250); resolve(); };
    const to = setTimeout(done, 1800 + text.length * (slow ? 150 : 100));
    u.onend = done; u.onerror = done;
    if (opts.spans) u.onstart = () => opts.spans.forEach((sp, i) => hlTimers.push(setTimeout(() => {
      opts.spans.forEach(x => x.classList.remove('lit')); sp.classList.add('lit');
    }, i * (slow ? 520 : 380))));
    speechSynthesis.speak(u);
  });
}
let ac;
function tone(freqs, type = 'sine', dur = .14, vol = .15){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + i * dur);
      g.gain.exponentialRampToValueAtTime(vol, t + i * dur + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * dur + dur);
      o.connect(g).connect(ac.destination);
      o.start(t + i * dur); o.stop(t + i * dur + dur + .05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1320]);
const bonk = () => tone([240, 170], 'triangle', .18);
const blip = () => tone([520, 780], 'sine', .08, .1);

/* =====================================================================
   MLUVENÍ – dítě opakuje slovo do mikrofonu (Chrome / Edge / Safari)
   ===================================================================== */
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOn = !!Rec && store.get('mic', true);
let rec = null, token = 0, micIntroDone = false;

let micTries = 0;
/* na dotykových zařízeních prohlížeč pustí mikrofon jen hned po klepnutí -> dítě klepne na mikrofon */
const tapMode = () => matchMedia('(pointer: coarse)').matches;
let tapStart = null, pendingFinish = null;
function setMic(state, heard = '', tries = 0){
  const m = $('#mic');
  micTries = tries;
  if (!state){ m.hidden = true; return; }
  m.hidden = false; m.dataset.state = state;
  $('#micBub').innerHTML = (state === 'listening' || state === 'tap') ? ICON_MIC + (state === 'tap' ? HAND.replace('class="tap"', 'class="taphand"') : '') : state === 'ok' ? ICON_OK : ICON_SPEAK;
  $('#heard').textContent = heard ? '„' + heard + '“' : '';
  [...$('#tries').children].forEach((d, i) => d.classList.toggle('used', i < tries));
}
/* hrubé „fonetické" porovnání: th→d, zdvojená písmena pryč, skupiny samohlásek → a */
const norm = s => s.toLowerCase().replace(/[^a-z ]/g, ' ').trim();
const sound = s => s.replace(/th/g, 'd').replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/(.)\1+/g, '$1').replace(/[aeiouy]+/g, 'a');
function lev(a, b){
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function matches(transcript, word){
  const w = norm(word).replace(/ /g, ''), sw = sound(w);
  const toks = norm(transcript).split(/\s+/).filter(Boolean);
  const cands = [...toks, toks.join('')];
  for (let i = 0; i < toks.length - 1; i++) cands.push(toks[i] + toks[i + 1]);
  const tol = Math.max(1, Math.floor(sw.length * .25));
  return cands.some(c => c === w || lev(sound(c), sw) <= tol);
}
function listen(word){
  return new Promise(resolve => {
    let done = false, heard = '';
    const r = new Rec();
    rec = r;
    r.lang = 'en-GB'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    let to = null;
    const finish = v => { if (done) return; done = true; clearTimeout(to); tapStart = pendingFinish = null; try { r.abort(); } catch (e) {} if (rec === r) rec = null; resolve(v); };
    r.onresult = e => {
      for (let i = 0; i < e.results.length; i++){
        const res = e.results[i];
        if (res[0]) heard = res[0].transcript;
        for (let j = 0; j < res.length; j++) if (matches(res[j].transcript, word)) return finish({ok: true, heard: res[j].transcript.trim()});
      }
      $('#heard').textContent = heard ? '„' + heard.trim() + '“' : '';
      if (e.results[e.results.length - 1].isFinal) finish({ok: false, heard: heard.trim()});
    };
    r.onerror = e => finish({ok: false, heard, fatal: ['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(e.error), err: e.error});
    r.onend = () => finish({ok: false, heard: heard.trim()});
    const begin = () => {
      setMic('listening', '', micTries); blip();
      to = setTimeout(() => finish({ok: false, heard: heard.trim()}), 7000);
      try { r.start(); } catch (e) { finish({ok: false, fatal: true, err: 'start'}); }
    };
    if (tapMode()){ pendingFinish = finish; tapStart = () => { tapStart = null; begin(); }; setMic('tap', '', micTries); }
    else begin();
  });
}
$('#micBub').onclick = () => { if (tapStart) tapStart(); };
function micBroken(err){
  micOn = false; updateToggles();
  note(err === 'not-allowed' || err === 'service-not-allowed'
    ? 'Mikrofon není povolený. Povolte ho v nastavení prohlížeče pro tuto stránku (ikona zámku vedle adresy → Oprávnění → Mikrofon) a zapněte znovu „Mluvení“.'
    : err === 'network'
      ? 'Rozpoznávání řeči potřebuje internet. Mluvení je zatím vypnuté.'
      : 'Mikrofon se nepodařilo spustit. Mluvení je zatím vypnuté.');
}
function cancelAll(){
  token++;
  if (pendingFinish) pendingFinish({ok: false});
  if (rec){ try { rec.abort(); } catch (e) {} rec = null; }
  if (canSpeak) speechSynthesis.cancel();
  clearHighlight(); setMic(null);
}
/* Appka řekne slovo, dítě ho zopakuje. 3 pokusy, pak „Good try!" a jde se dál.
   Vrací true (zvládlo), false (nezvládlo), null (mluvení vypnuté nebo přerušeno). */
async function practice(word){
  const tk = token;
  if (!micOn) return null;
  if (!micIntroDone && csVoice){
    micIntroDone = true;
    setMic('speaking');
    await say('Poslouchej a zopakuj.', {cz: true});
    if (tk !== token) return null;
  }
  for (let attempt = 1; attempt <= 3; attempt++){
    setMic('speaking', '', attempt - 1);
    await say(word);
    if (tk !== token) return null;
    await wait(150);
    micTries = attempt - 1;
    const r = await listen(word);
    if (tk !== token) return null;
    if (r.fatal){ setMic(null); micBroken(r.err); return null; }
    if (r.ok){
      setMic('ok', r.heard, attempt); ding();
      await say(pick(['Great!', 'Well done!', 'Super!', 'Yes!', 'Good job!']));
      if (tk !== token) return null;
      setMic(null); return true;
    }
    setMic('miss', r.heard, attempt); bonk();
    await wait(800);
    if (tk !== token) return null;
  }
  setMic('ok', '', 3);
  await say('Good try!');
  if (tk !== token) return null;
  setMic(null); return false;
}

/* =====================================================================
   PŘEPÍNAČE PRO RODIČE
   ===================================================================== */
let showCz = store.get('cz', true);
function updateToggles(){
  $('#micBtn').setAttribute('aria-pressed', micOn);
  $('#slowBtn').setAttribute('aria-pressed', slow);
  $('#czBtn').setAttribute('aria-pressed', showCz);
  document.body.classList.toggle('no-cz', !showCz);
}
$('#micBtn').onclick = () => {
  if (!Rec){ note('Tento prohlížeč neumí rozpoznávat řeč. Na Androidu použijte Chrome, na iPhonu/iPadu Safari, na počítači Chrome nebo Edge.'); return; }
  micOn = !micOn; store.set('mic', micOn); if (micOn) note(''); else cancelAll(); updateToggles(); };
$('#slowBtn').onclick = () => { slow = !slow; store.set('slow', slow); updateToggles(); };
$('#czBtn').onclick = () => { showCz = !showCz; store.set('cz', showCz); updateToggles(); };
updateToggles();

function wave(el){ el.classList.remove('waving'); void el.offsetWidth; el.classList.add('waving'); }
function confetti(n = 70){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('#confetti'), cols = ['#F25F3F','#FFC94A','#2E9E68','#4A8FE0','#FF7A9C','#9B6FD1'];
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    p.style.animationDelay = Math.random() * .5 + 's';
    box.appendChild(p);
    setTimeout(() => p.remove(), 4500);
  }
}

/* =====================================================================
   DOMŮ – výběr tématu
   ===================================================================== */
let T = null;            // aktuální téma
let started = {};
$('#topics').innerHTML = TOPICS.map((t, i) =>
  `<button class="topic" data-i="${i}" aria-label="${t.cz}"><span class="pic">${t.cover()}</span><b>${t.en}</b><small>${t.cz}</small></button>`).join('');
$('#topics').onclick = e => {
  const b = e.target.closest('.topic'); if (!b) return;
  openTopic(TOPICS[+b.dataset.i]);
};
function openTopic(t, play = true){
  T = t; started = {}; li = 0; learnDone = new Set();
  $('#title').innerHTML = t.en.replace(/(\S+)$/, '<span>$1</span>');
  $('#subtitle').textContent = t.cz;
  $('#homeBtn').hidden = false; $('#tabs').hidden = false;
  show('learn', play);
}
function goHome(){
  cancelAll(); T = null;
  $('#title').innerHTML = "Let's <span>learn!</span>";
  $('#subtitle').textContent = 'Angličtina pro prvňáčky';
  $('#homeBtn').hidden = true; $('#tabs').hidden = true;
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'home');
}
$('#homeBtn').onclick = goHome;

/* =====================================================================
   UČÍME SE
   ===================================================================== */
let li = 0, tapped = false, learnDone = new Set();
const HAND = `<svg class="tap" viewBox="0 0 48 48"><path d="M18 6a4 4 0 0 1 8 0v14l9 2a5 5 0 0 1 4 6l-2 10a7 7 0 0 1-7 6H22a7 7 0 0 1-6-3L8 30a4 4 0 0 1 6-5l4 4z" fill="#FFE2C9" stroke="#1E2A47" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const cards = () => [...T.items, T.final];
function renderDots(){
  $('#dots').innerHTML = cards().map((c, i) =>
    `<button class="dot ${learnDone.has(c.id) ? 'done' : ''}" aria-label="${c.en}" aria-current="${i === li}" data-i="${i}"></button>`).join('');
}
function renderLearn(play){
  cancelAll();
  const all = cards(), m = all[li], stage = $('#stage');
  stage.classList.toggle('wide', !!m.wide);
  stage.innerHTML = (tapped ? '' : HAND) + `<div class="pop">${m.draw()}</div>`;
  $('#word').textContent = m.en;
  $('#wordCz').textContent = '= ' + m.cz;
  const keys = m.en.toLowerCase().split(' ');
  $('#sentence').innerHTML = m.sentence.split(' ').map((w, i) =>
    `<span class="${keys.includes(w.replace(/[^a-z]/gi, '').toLowerCase()) ? 'key' : ''}" style="animation-delay:${.35 + i * .18}s">${w}</span>`).join('');
  $('#cz').textContent = m.czs;
  renderDots();
  $('#prev').disabled = li === 0;
  $('#next').disabled = li === all.length - 1;
  if (play){ const tk = token; setTimeout(() => { if (tk === token) learnPlay(); }, 700); }
}
async function learnPlay(){
  cancelAll();
  const tk = token, m = cards()[li];
  wave($('#stage'));
  await say(m.sentence, {spans: [...$('#sentence').children]});
  if (tk !== token) return;
  const ok = await practice(m.en);
  if (ok){ learnDone.add(m.id); renderDots(); wave($('#stage')); }
}
$('#prev').onclick = () => { if (li > 0){ tapped = true; li--; renderLearn(true); } };
$('#next').onclick = () => { if (li < cards().length - 1){ tapped = true; li++; renderLearn(true); } };
$('#dots').onclick = e => { const d = e.target.closest('.dot'); if (d){ tapped = true; li = +d.dataset.i; renderLearn(true); } };
$('#stage').onclick = () => { tapped = true; $('#stage .tap')?.remove(); learnPlay(); };
$('#sayWord').onclick = () => { cancelAll(); wave($('#stage')); say(cards()[li].en); };
$('#saySentence').onclick = () => { cancelAll(); say(cards()[li].sentence, {spans: [...$('#sentence').children]}); };
document.addEventListener('keydown', e => {
  if ($('#learn').hidden || !$('#overlay').hidden) return;
  if (e.key === 'ArrowLeft') $('#prev').click();
  if (e.key === 'ArrowRight') $('#next').click();
});

/* =====================================================================
   KVÍZ „Kde je?" – poslech + klepnutí na obrázek, pak zopakovat slovo
   ===================================================================== */
const Q_TOTAL = 8;
let q = {};
function newQuiz(){ cancelAll(); q = {round: 0, results: [], target: null, firstTry: true, lock: false}; nextQ(); }
function renderStars(el, results, total){
  el.innerHTML = Array.from({length: total}, (_, i) =>
    `<svg viewBox="0 0 24 24"><path class="${results[i] === undefined ? 's0' : results[i] ? 's1' : 's2'}" d="${STAR}"/></svg>`).join('');
}
function nextQ(){
  if (q.round >= Q_TOTAL) return finish('quiz');
  q.round++;
  const items = T.items;
  let t; do { t = pick(items); } while (q.target && t.id === q.target.id && items.length > 1);
  q.target = t; q.firstTry = true; q.lock = false;
  const n = Math.min(q.round > 4 ? 4 : 3, items.length);
  const opts = shuffle([t, ...shuffle(items.filter(m => m.id !== t.id)).slice(0, n - 1)]);
  $('#qText').innerHTML = t.where.replace(t.en, `<b>${t.en}</b>`);
  $('#qCz').textContent = t.czw;
  const box = $('#options');
  box.className = 'options' + (n === 4 ? ' four' : '');
  box.innerHTML = opts.map(m => `<button class="opt" data-id="${m.id}" aria-label="${m.en}">${m.draw()}</button>`).join('');
  renderStars($('#stars'), q.results, Q_TOTAL);
  const tk = token;
  setTimeout(() => { if (tk === token) say(t.where); }, 350);
}
$('#options').onclick = async e => {
  const b = e.target.closest('.opt');
  if (!b || q.lock) return;
  const m = T.items.find(x => x.id === b.dataset.id);
  cancelAll();
  const tk = token;
  if (m.id === q.target.id){
    q.lock = true;
    b.classList.add('right'); wave(b); ding();
    q.results.push(q.firstTry);
    renderStars($('#stars'), q.results, Q_TOTAL);
    await say('Yes! ' + m.sentence);
    if (tk !== token) return;
    await practice(m.en);
    if (tk !== token) return;
    await wait(400);
    if (tk === token) nextQ();
  } else {
    q.firstTry = false;
    b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
    bonk(); say('No. ' + m.sentence);
  }
};
$('#qSay').onclick = () => { if (q.target && !q.lock){ cancelAll(); say(q.target.where); } };

/* =====================================================================
   PEXESO – po otočení kartičky dítě slovo zopakuje, teprve pak hraje dál
   ===================================================================== */
let mem = {};
function newMemory(){
  cancelAll();
  const six = shuffle(T.items).slice(0, 6);
  mem = {deck: shuffle([...six, ...six]), first: null, lock: false, moves: 0, found: 0, pairs: six.length};
  $('#moves').textContent = 'Tahy: 0';
  $('#grid').innerHTML = mem.deck.map((m, i) =>
    `<button class="mcard" data-i="${i}" aria-label="Kartička ${i + 1}"><span class="in">
      <span class="face back">?</span>
      <span class="face front"><span class="lbl">${m.en}</span>${m.draw()}</span>
    </span></button>`).join('');
}
$('#grid').onclick = async e => {
  const c = e.target.closest('.mcard');
  if (!c || mem.lock || c.classList.contains('open') || c.classList.contains('done')) return;
  const m = mem.deck[+c.dataset.i];
  c.classList.add('open');
  mem.lock = true;
  cancelAll();
  const tk = token;
  if (micOn){
    await wait(350);
    if (tk !== token){ c.classList.remove('open'); mem.lock = false; return; }
    await practice(m.en);
    if (tk !== token){ c.classList.remove('open'); mem.lock = false; return; }
  } else {
    say(m.en);
  }
  if (!mem.first){ mem.first = c; mem.lock = false; return; }
  const a = mem.first; mem.first = null;
  mem.moves++; $('#moves').textContent = 'Tahy: ' + mem.moves;
  if (mem.deck[+a.dataset.i].id === m.id){
    await wait(400);
    a.classList.add('done'); c.classList.add('done'); ding();
    wave(a); wave(c);
    mem.found++;
    await say(m.sentence);
    mem.lock = false;
    if (mem.found === mem.pairs) setTimeout(() => finish('memory'), 600);
  } else {
    setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); mem.lock = false; }, 1300);
  }
};
$('#memReset').onclick = newMemory;

/* =====================================================================
   KONEC HRY + ZÁLOŽKY
   ===================================================================== */
let lastGame = 'quiz';
function finish(game){
  lastGame = game;
  if (game === 'quiz'){
    const good = q.results.filter(Boolean).length;
    $('#ovText').textContent = `Napoprvé správně: ${good} z ${Q_TOTAL}.`;
    renderStars($('#ovStars'), q.results, Q_TOTAL);
  } else {
    $('#ovText').textContent = `Všechny dvojice! Počet tahů: ${mem.moves}.`;
    $('#ovStars').innerHTML = '';
  }
  $('#overlay').hidden = false;
  confetti(); ding(); say('Well done! Great job!');
}
$('#ovAgain').onclick = () => { $('#overlay').hidden = true; lastGame === 'quiz' ? newQuiz() : newMemory(); };
$('#ovLearn').onclick = () => { $('#overlay').hidden = true; show('learn'); };

function show(view, fresh){
  cancelAll();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== view);
  if (view === 'learn') renderLearn(!!fresh);
  if (view === 'quiz'){
    if (!started.quiz){ started.quiz = true; newQuiz(); }
    else if (q.target){ q.lock = false; say(q.target.where); }
  }
  if (view === 'memory'){
    if (!started.memory){ started.memory = true; newMemory(); }
    else mem.lock = false;
  }
}
$('#tabs').onclick = e => { const t = e.target.closest('.tab'); if (t) show(t.dataset.view); };

/* jen jedno téma? rovnou ho otevři, domovská obrazovka se objeví, až jich bude víc */
if (TOPICS.length === 1) openTopic(TOPICS[0], false);
</script>
